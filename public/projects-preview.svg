<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#09090B"/>
  
  <!-- Section Title -->
  <text x="600" y="70" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" letter-spacing="-0.02em">
    Featured Engineering Work
  </text>
  <text x="600" y="102" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    High-impact systems built with emphasis on architecture, performance, and clean tradeoffs.
  </text>

  <!-- Featured Project Card -->
  <rect x="100" y="135" width="1000" height="450" rx="24" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  
  <!-- Badge & Title -->
  <rect x="135" y="165" width="150" height="26" rx="13" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1"/>
  <text x="150" y="182" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="500">Featured Case Study</text>
  
  <text x="135" y="225" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600">IntelliLight</text>
  <text x="135" y="252" fill="#FFFFFF" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="15">
    Reinforcement Learning adaptive traffic signal control system optimizing urban flow.
  </text>

  <!-- SVG Architecture Flow Diagram Container -->
  <rect x="135" y="280" width="930" height="85" rx="18" fill="#111111" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  
  <!-- Diagram Flow Line -->
  <line x1="220" y1="322" x2="980" y2="322" stroke="#3B82F6" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Diagram Nodes -->
  <!-- Node 1 -->
  <rect x="155" y="297" width="130" height="50" rx="12" fill="#18181B" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="220" y="315" text-anchor="middle" fill="#3B82F6" font-family="monospace" font-size="9">01</text>
  <text x="220" y="333" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">SUMO Engine</text>

  <!-- Node 2 -->
  <rect x="340" y="297" width="145" height="50" rx="12" fill="#18181B" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="412" y="315" text-anchor="middle" fill="#3B82F6" font-family="monospace" font-size="9">02</text>
  <text x="412" y="333" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Environment State</text>

  <!-- Node 3 -->
  <rect x="535" y="297" width="130" height="50" rx="12" fill="#18181B" stroke="#3B82F6" stroke-opacity="0.4"/>
  <text x="600" y="315" text-anchor="middle" fill="#3B82F6" font-family="monospace" font-size="9">03</text>
  <text x="600" y="333" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">RL Agent</text>

  <!-- Node 4 -->
  <rect x="715" y="297" width="145" height="50" rx="12" fill="#18181B" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="787" y="315" text-anchor="middle" fill="#3B82F6" font-family="monospace" font-size="9">04</text>
  <text x="787" y="333" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Reward Function</text>

  <!-- Node 5 -->
  <rect x="905" y="297" width="145" height="50" rx="12" fill="#18181B" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="977" y="315" text-anchor="middle" fill="#3B82F6" font-family="monospace" font-size="9">05</text>
  <text x="977" y="333" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Signal Actuator</text>

  <!-- Tech Chips -->
  <rect x="135" y="385" width="60" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="165" y="401" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6" font-family="monospace" font-size="11">Python</text>

  <rect x="205" y="385" width="65" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="237" y="401" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6" font-family="monospace" font-size="11">PyTorch</text>

  <rect x="280" y="385" width="145" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="352" y="401" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6" font-family="monospace" font-size="11">Reinforcement Learning</text>

  <!-- Metrics Grid -->
  <rect x="135" y="430" width="280" height="75" rx="14" fill="#111111" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <text x="150" y="452" fill="#FFFFFF" fill-opacity="0.4" font-family="monospace" font-size="10">PROBLEM</text>
  <text x="150" y="475" fill="#FFFFFF" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Static signal timing wastes >28% throughput.</text>

  <rect x="435" y="430" width="280" height="75" rx="14" fill="#111111" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <text x="450" y="452" fill="#FFFFFF" fill-opacity="0.4" font-family="monospace" font-size="10">SOLUTION</text>
  <text x="450" y="475" fill="#FFFFFF" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Deep Q-Network dynamically tuning phase timing.</text>

  <rect x="735" y="430" width="330" height="75" rx="14" fill="#111111" fill-opacity="0.6" stroke="#3B82F6" stroke-opacity="0.2"/>
  <text x="750" y="452" fill="#3B82F6" font-family="monospace" font-size="10">MEASURED IMPACT</text>
  <text x="750" y="475" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">-34% average wait time vs fixed baselines.</text>

  <!-- CTA -->
  <rect x="135" y="525" width="130" height="38" rx="19" fill="#FFFFFF"/>
  <text x="200" y="549" text-anchor="middle" fill="#09090B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Source Code ↗</text>
</svg>
